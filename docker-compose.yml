version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pg_payment_gateway
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: redis_payment_gateway
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment_network

  # API Gateway Service
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    container_name: svc_api_gateway
    environment:
      - APP_NAME=payment-gateway
      - APP_ENV=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=payment_gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=debug
      - LOG_FORMAT=json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment_network
    restart: unless-stopped

  # Orchestrator Service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    container_name: svc_orchestrator
    environment:
      - APP_NAME=orchestrator
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=payment_gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment_network
    restart: unless-stopped

  # Validator Service
  validator:
    build:
      context: .
      dockerfile: Dockerfile
      target: validator
    container_name: svc_validator
    environment:
      - APP_NAME=validator
      - APP_ENV=development
      - LOG_LEVEL=debug
    networks:
      - payment_network
    restart: unless-stopped

  # Anti-Fraud Service
  antifraud:
    build:
      context: .
      dockerfile: Dockerfile
      target: antifraud
    container_name: svc_antifraud
    environment:
      - APP_NAME=antifraud
      - APP_ENV=development
      - ANTIFRAUD_ENABLED=true
      - ANTIFRAUD_RISK_THRESHOLD=0.7
      - LOG_LEVEL=debug
    networks:
      - payment_network
    restart: unless-stopped

  # Tokenizer Service
  tokenizer:
    build:
      context: .
      dockerfile: Dockerfile
      target: tokenizer
    container_name: svc_tokenizer
    environment:
      - APP_NAME=tokenizer
      - APP_ENV=development
      - TOKENIZER_ALGORITHM=AES-256-GCM
      - LOG_LEVEL=debug
    networks:
      - payment_network
    restart: unless-stopped

  # Adapter Service
  adapter:
    build:
      context: .
      dockerfile: Dockerfile
      target: adapter
    container_name: svc_adapter
    environment:
      - APP_NAME=adapter
      - APP_ENV=development
      - ADAPTER_DEFAULT=sbp
      - ADAPTER_SBP_SANDBOX=true
      - ADAPTER_DIGITAL_RUBLE_SANDBOX=true
      - LOG_LEVEL=debug
    networks:
      - payment_network
    restart: unless-stopped

  # Notification Service
  notification:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification
    container_name: svc_notification
    environment:
      - APP_NAME=notification
      - APP_ENV=development
      - NOTIFICATION_ENABLED=true
      - LOG_LEVEL=debug
    networks:
      - payment_network
    restart: unless-stopped

  # Logger Service
  logger:
    build:
      context: .
      dockerfile: Dockerfile
      target: logger
    container_name: svc_logger
    environment:
      - APP_NAME=logger
      - APP_ENV=development
      - LOG_LEVEL=debug
      - LOG_OUTPUT=/var/log/payment-gateway/app.log
    volumes:
      - logger_logs:/var/log/payment-gateway
    networks:
      - payment_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logger_logs:
    driver: local

networks:
  payment_network:
    driver: bridge
